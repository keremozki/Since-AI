  - rule_id: ADA-404.2.3
    title: Door clear width (2010 ADA Standards)
    clause: 2010 ADA Standards 404.2.3
    edition: 2010 ADA Standards for Accessible Design
    source: 2010 ADA Standards (Access Board PDF) and 28 CFR 36.406, as quoted in rule_fact_definitions.md section 1
    verified: true
    why: The 2010 ADA Standards are written for buildings and sites, so their door width is only a design benchmark on a ship unless the owner's compliance basis names them.
    status_note: >-
      Benchmark only unless the compliance basis names it: the Standards cover fixed elements of buildings, structures and sites
      (28 CFR 36.406(b)), and gangways that connect to vessels are not addressed (106.5). ADA Title III can reach a foreign-flag
      cruise ship in U.S. waters except for its internal affairs (Spector, 2005; read from summaries only).
    conditions:
      - {field: ada_2010_named, op: "==", value: "yes", clause: "28 CFR 36.406(b)", ask: "Does the owner's compliance basis name the 2010 ADA Standards (404.2.3) for this ship?"}
    note: >-
      Clear width is measured between the face of the door and the stop with the door open 90 degrees; it is not the leaf, frame
      or nominal door width. The 36 in (915 mm) figure applies to openings more than 24 in (610 mm) deep.
