id: masthead_forward.height_above_hull
subject: masthead_forward
property: height_above_hull
kind: length
meaning: Height of the forward masthead light above the uppermost continuous deck,
  measured vertically beneath the light (COLREG Annex I 1).
labels:
- FORWARD MASTHEAD LIGHT
- FWD MASTHEAD LIGHT
- MASTHEAD LIGHT
- MAST HEAD LIGHT
not:
- ABOVE BASELINE
- ABL
- ABOVE KEEL
- ABOVE WATERLINE
- ABOVE DWL
