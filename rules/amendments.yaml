  - id: SOLAS-II-1-3-4-TOWING
    resolution: MSC 108 amendment to SOLAS II-1/3-4 (resolution number not in the notes)
    kind: amendment
    title: Emergency towing arrangements (SOLAS II-1/3-4)
    adopted: "MSC 108 (May 2024)"
    in_force: "2028-01-01"
    trigger: null
    trigger_unconfirmed: true
    summary: Emergency towing extended to all new ships over 20,000 GT other than tankers, in force 1 January 2028.
    affects: [Emergency towing arrangements]
    rule_ids: []
    source: https://www.dnv.com/news/2024/imo-maritime-safety-committee-msc-108/
    verified: false
    applies_if:
      - {field: gross_tonnage, op: ">", value: 20000, clause: "SOLAS II-1/3-4 (MSC 108)", ask: "What is the ship's gross tonnage?"}
      - manual: "Is the ship 'new' for SOLAS II-1/3-4: which date (keel laying, contract or delivery) does the amendment use?"
        needs: "trigger date for SOLAS II-1/3-4 emergency towing"
        clause: "SOLAS II-1/3-4 (MSC 108)"
        why: "The source says 'new ships' without naming the date."
    note: Tankers are excluded, and the card has no tanker type; a tanker would show as can't tell, not as not applicable.

  - id: MSC.1/Circ.1350/Rev.1
    resolution: MSC.1/Circ.1350/Rev.1
    kind: interpretation
    title: Interpretation of SOLAS V/22.1.6, ship's side visible from the bridge wing
    adopted: "2012-12-04"
    in_force: "2011-01-01"
    trigger: contract_date
    trigger_unconfirmed: false
    summary: >-
      For ships contracted for construction on or after 1 January 2011, V/22.1.6 is met when the sea surface from the bridge wing
      reaches the point under the maximum beam (view plus a lean of not more than 400 mm), or the sea surface 500 mm outboard of
      the maximum beam is visible. Tug, OSV, rescue and work ships use 1,500 mm.
    affects: [Bridge wing visibility, Bridge wing outer edge]
    rule_ids: [SOLAS-V-22]
    source: https://www.traficom.fi/files/media/regulation/22703-MSC_1-Circ_1350_rev_1_-_Tulkinta_SOLAS_V_22_1_6_Rev_1.pdf
    verified: true
    applies_like: SOLAS-V-22
    applies_if:
      - {field: contract_date, op: on_or_after, value: "2011-01-01", clause: "MSC.1/Circ.1350/Rev.1", ask: "What is the building contract date?"}
    note: >-
      "Contracted for construction" is the date the contract is signed between the prospective owner and the shipbuilder. The
      in_force date is the contract date the interpretation starts at; the circular itself is dated 4 December 2012.
