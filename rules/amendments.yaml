# IMO amendments and interpretations mapped to a hull by the date each one keys on. Read by app.basis.whatif.
#
# Only entries with a source are listed. Each has: id, resolution, adopted, in_force, trigger (the card date it keys on:
# keel_date, contract_date, delivery_date or installation_date, a list when the text uses several, or "none" when it covers
# new and existing ships), trigger_unconfirmed, summary, affects, rule_ids, source, verified, and applies_if.
#
# `trigger_unconfirmed: true` means the sources do not say which date triggers the amendment. Its status is then "can't
# tell" with a question, never a guess. `verified: true` only where the research notes quote the primary text.
#
# `applies_like: <rule_id>` reuses that rule's conditions from applicability.yaml; `applies_if` adds to them. The condition
# language is the one in conditions.py. Dates are YYYY-MM-DD; adopted and in_force may be text where the exact day is not in the notes.
#
# Notes: research_notes/Product direction and hackathon strategy/directions_part2.md (Direction 4, Direction 3),
# rules_feasibility_and_legal.md section 4, meyer_and_cruise_compliance.md section 3.

amendments:

  - id: MSC.404(96)
    resolution: MSC.404(96)
    kind: amendment
    title: Evacuation analysis (SOLAS II-2/13.3.2.7)
    adopted: "2016-05-19"
    in_force: "2020-01-01"
    trigger: keel_date
    trigger_unconfirmed: false
    summary: >-
      Evacuation analysis early in the design for ro-ro passenger ships constructed on or after 1 July 1999 and other passenger
      ships constructed on or after 1 January 2020 carrying more than 36 passengers. The old paragraph 7.4 was deleted.
    affects: [Evacuation analysis, Escape routes, Stair and corridor widths]
    rule_ids: [SOLAS-II-2-13.3.2.7, MSC.1-CIRC.1533, FSS-13-STAIR]
    source: https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MSCResolutions/MSC.404%2896%29.pdf
    verified: true
    applies_like: SOLAS-II-2-13.3.2.7
    note: The trigger is the keel-laying date or a similar stage, not the contract or delivery date.

  - id: MSC.216(82)-SRTP
    resolution: MSC.216(82) Annex 3
    kind: amendment
    title: Safe return to port (SOLAS II-2/21, II-2/22, II-1/8-1)
    adopted: "2006-12-08"
    in_force: "2010-07-01"
    trigger: keel_date
    trigger_unconfirmed: false
    summary: >-
      Safe return to port applies to passenger ships constructed on or after 1 July 2010 with a length of 120 m or more or three
      or more main vertical zones. II-1/8-1 applies to passenger ships to which II-2/21 applies.
    affects: [Essential systems availability, Safe areas, Fire and flooding casualty thresholds]
    rule_ids: []
    source: https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MSCResolutions/MSC.216%2882%29.pdf
    verified: false
    applies_if:
      - {field: ship_type, op: in, value: [passenger, ro_ro_passenger], clause: "SOLAS II-2/21.1, 22.1", ask: "What is the SOLAS ship type: passenger, ro-ro passenger, cargo or special purpose?"}
      - {field: constructed, op: on_or_after, value: "2010-07-01", clause: "SOLAS II-2/21.1, 22.1", ask: "What is the keel-laying date?"}
      - any_of:
          - {field: load_line_length_m, op: ">=", value: 120, clause: "SOLAS II-2/21.1 (length per II-1/2.5)", ask: "What is the Load Line length?"}
          - {field: main_vertical_zones, op: ">=", value: 3, clause: "SOLAS II-2/21.1, 22.1", ask: "How many main vertical zones does the ship have?"}
    note: >-
      In the adopted text Reg 21.1 takes length from II-1/2.5 but Reg 22.1 cites II-1/2.2; whether the consolidated text fixed that
      is unverified in the notes. The Load Line length is used here.

  - id: MSC.338(91)
    resolution: MSC.338(91)
    kind: amendment
    title: Noise Code (SOLAS II-1/3-12), full requirements
    adopted: null
    in_force: "2014-07-01"
    trigger: [contract_date, delivery_date]
    trigger_unconfirmed: false
    summary: >-
      Ships of 1,600 GT and above with a building contract on or after 1 July 2014, or (with no contract) a keel on or after
      1 January 2015, or delivery on or after 1 July 2018, must meet the full Noise Code. The Administration may deem a particular
      provision unreasonable or impractical. A cruise ship contracted in 2012 is caught or not by its delivery date alone.
    affects: [Machinery space noise, Accommodation and working space noise limits, Noise survey]
    rule_ids: []
    source: https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MSCResolutions/MSC.338%2891%29.pdf
    verified: false
    applies_if:
      - {field: gross_tonnage, op: ">=", value: 1600, clause: "SOLAS II-1/3-12.1", ask: "What is the ship's gross tonnage?"}
      - any_of:
          - {field: contract_date, op: on_or_after, value: "2014-07-01", clause: "SOLAS II-1/3-12 (MSC.338(91))", ask: "What is the building contract date?"}
          - {field: delivery_date, op: on_or_after, value: "2018-07-01", clause: "SOLAS II-1/3-12 (MSC.338(91))", ask: "What is the delivery date?"}
    note: >-
      Delivery slippage can flip the regime: a ship contracted before 2014-07-01 is caught if it is delivered on or after
      2018-07-01. The branch for a ship with no building contract (keel on or after 2015-01-01) is not modelled. See the
      transitional entry for the other side of the trap.

  - id: MSC.338(91)-TRANSITIONAL
    resolution: MSC.338(91) paragraph 2
    kind: amendment
    title: Noise Code, transitional machinery-space measures only
    adopted: null
    in_force: "2014-07-01"
    trigger: [contract_date, keel_date, delivery_date]
    trigger_unconfirmed: false
    summary: >-
      Ships delivered before 1 July 2018 that were contracted before 1 July 2014 with a keel laid between 1 January 2009 and
      1 January 2015 only need the machinery-space noise measures.
    affects: [Machinery space noise]
    rule_ids: []
    source: https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MSCResolutions/MSC.338%2891%29.pdf
    verified: false
    applies_if:
      - {field: gross_tonnage, op: ">=", value: 1600, clause: "SOLAS II-1/3-12.1", ask: "What is the ship's gross tonnage?"}
      - {field: contract_date, op: before, value: "2014-07-01", clause: "SOLAS II-1/3-12.2 (MSC.338(91))", ask: "What is the building contract date?"}
      - {field: keel_date, op: on_or_after, value: "2009-01-01", clause: "SOLAS II-1/3-12.2 (MSC.338(91))", ask: "What is the keel-laying date?"}
      - {field: keel_date, op: before, value: "2015-01-01", clause: "SOLAS II-1/3-12.2 (MSC.338(91))", ask: "What is the keel-laying date?"}
      - {field: delivery_date, op: before, value: "2018-07-01", clause: "SOLAS II-1/3-12.2 (MSC.338(91))", ask: "What is the delivery date?"}
    note: The research notes paraphrase paragraph 2; the exact text was not quoted.

  - id: MSC.550(108)
    resolution: MSC.550(108)
    kind: amendment
    title: Ro-ro passenger ship fire safety (SOLAS II-2/20)
    adopted: "2024-05-23"
    in_force: "2026-01-01"
    trigger: none
    trigger_unconfirmed: false
    summary: >-
      Amended requirements for new and existing ro-ro passenger ships: vehicle spaces, special category spaces, ro-ro spaces and
      new weather-deck requirements. FSS ch. 7 and ch. 9 changes came with it.
    affects: [Vehicle space fire protection, Weather-deck water monitors, Detection]
    rule_ids: []
    source: https://www.mardep.gov.hk/filemanager/en/share/msnote/pdf/msin2437.pdf
    verified: false
    applies_if:
      - {field: ship_type, op: "==", value: ro_ro_passenger, clause: "SOLAS II-2/20 (MSC.550(108))", ask: "What is the SOLAS ship type: passenger, ro-ro passenger, cargo or special purpose?"}
    note: It covers new and existing ro-ro passenger ships, so no date decides it. Cruise ships are generally not ro-ro passenger ships.

  - id: MSC.589(111)
    resolution: MSC.589(111)
    kind: amendment
    title: LSA Code amendments
    adopted: "MSC 111 (13-22 May 2026)"
    in_force: "2028-01-01"
    trigger: installation_date
    trigger_unconfirmed: true
    summary: >-
      Lifejackets, lifeboat fittings and ventilation, release-system test, lowering speed of launching appliances installed on or
      after 1 January 2026, and launching appliances without stored mechanical power for rescue boats.
    affects: [Lifejackets, Lifeboat fittings and ventilation, Launching appliances, Rescue boat launching]
    rule_ids: [SOLAS-III-21-LIFEBOATS, SOLAS-III-21-LIFERAFTS, SOLAS-III-RAFTS]
    source: https://www.mpa.gov.sg/api/media/32148767-1ad5-4219-92cf-7835a30d00ce/sc_no_8_of_2026.pdf
    verified: false
    applies_if:
      - manual: "Which date triggers MSC.589(111) for this ship: the keel-laying date, the delivery date, or the installation date of the launching appliances?"
        needs: "trigger date for MSC.589(111)"
        clause: "MSC.589(111)"
        why: "The Singapore circular names an installation date only for the lowering-speed item and gives the entry-into-force date 1 January 2028 for the rest."
    note: Entry into force is 2028-01-01; which ships it reaches is not stated in the sources.

  - id: SOLAS-V-23-PILOT
    resolution: MSC 110 amendment to SOLAS V/23 (resolution number not in the notes)
    kind: amendment
    title: Pilot transfer arrangements (SOLAS V/23)
    adopted: "2025-06 (MSC 110)"
    in_force: "2028-01-01"
    trigger: installation_date
    trigger_unconfirmed: false
    summary: >-
      New pilot transfer arrangements installed on or after 1 January 2028 follow the amended V/23. Existing arrangements follow
      it by the first survey on or after 1 January 2029.
    affects: [Pilot ladders, Pilot hoists, Pilot embarkation arrangements]
    rule_ids: []
    source: https://www.dnv.com/news/2025/imo-maritime-safety-committee-msc-110/
    verified: false
    applies_if:
      - {field: installation_date, op: on_or_after, value: "2028-01-01", clause: "SOLAS V/23 (MSC 110)", ask: "On what date is the pilot transfer arrangement installed?"}
    note: The date is per arrangement. The existing-arrangement route (first survey on or after 2029-01-01) is not modelled.

  - id: MSC.591(111)
    resolution: MSC.591(111)
    kind: amendment
    title: Load Lines, guard rails and bulwarks around exposed decks
    adopted: "MSC 111 (13-22 May 2026)"
    in_force: "2028-01-01"
    trigger: keel_date
    trigger_unconfirmed: false
    summary: Guard rails and bulwarks around exposed decks for ships with keels laid, or at a similar stage, on or after 1 January 2028.
    affects: [Guard rails, Bulwarks, Exposed decks]
    rule_ids: []
    source: https://www.mpa.gov.sg/api/media/32148767-1ad5-4219-92cf-7835a30d00ce/sc_no_8_of_2026.pdf
    verified: false
    applies_if:
      - {field: constructed, op: on_or_after, value: "2028-01-01", clause: "Load Lines (MSC.591(111))", ask: "What is the keel-laying date?"}
    note: The source gives the keel trigger date, 1 January 2028, and no separate entry-into-force date, so in_force repeats the trigger date.

  - id: MSC.583(111)
    resolution: MSC.583(111)
    kind: amendment
    title: VDES and GMDSS carriage
    adopted: "MSC 111 (13-22 May 2026)"
    in_force: "2028-01-01"
    trigger: null
